services:
  api:
    build:
      context: ./tervex-backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: sqlite://data/tervex.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    ports:
      - "3000:3000"
    volumes:
      - tervex-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./TerveX
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tervex-data:
